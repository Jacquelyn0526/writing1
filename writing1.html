    <script>
        // Audio & Speech Synthesis Manager
        class SpeechAudioEngine {
            constructor() {
                this.soundEnabled = true;
                this.synth = window.speechSynthesis;
                this.audioCtx = null;
            }

            initCtx() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            toggleSound() {
                this.soundEnabled = !this.soundEnabled;
                const icon = document.getElementById('soundIcon');
                if (icon) {
                    icon.className = this.soundEnabled ? 'fa-solid fa-volume-high text-purple-600 text-base' : 'fa-solid fa-volume-xmark text-rose-500 text-base';
                }
            }

            // Speak word/phrase/sentence audio (TTS)
            speak(text) {
                if (!this.soundEnabled || !this.synth) return;
                this.synth.cancel(); // Stop ongoing speech
                
                // Clean punctuation before speaking phrase/sentence nicely
                const cleanText = text.replace(/[,.]/g, '').trim();
                if (!cleanText) return;
                
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Slower speed for Year 2 pupils
                utterance.pitch = 1.05; // Friendly warm tone
                this.synth.speak(utterance);
            }

            playPopTone() {
                if (!this.soundEnabled) return;
                try {
                    this.initCtx();
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, this.audioCtx.currentTime); // D5
                    gain.gain.setValueAtTime(0.12, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start();
                    osc.stop(this.audioCtx.currentTime + 0.1);
                } catch (e) {}
            }

            playSuccessSound() {
                if (!this.soundEnabled) return;
                try {
                    this.initCtx();
                    const now = this.audioCtx.currentTime;
                    const freqs = [523.25, 659.25, 783.99, 1046.50]; // C, E, G, C
                    freqs.forEach((freq, idx) => {
                        const osc = this.audioCtx.createOscillator();
                        const gain = this.audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + (idx * 0.09));
                        gain.gain.setValueAtTime(0.15, now + (idx * 0.09));
                        gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.09) + 0.25);
                        osc.connect(gain);
                        gain.connect(this.audioCtx.destination);
                        osc.start(now + (idx * 0.09));
                        osc.stop(now + (idx * 0.09) + 0.25);
                    });
                } catch (e) {}
            }

            playErrorSound() {
                if (!this.soundEnabled) return;
                try {
                    this.initCtx();
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, this.audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.12, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start();
                    osc.stop(this.audioCtx.currentTime + 0.25);
                } catch (e) {}
            }
        }

        const audioManager = new SpeechAudioEngine();

        // 3 Narrative Sets - Each is a fixed sequence short story about 1 single character

        const state = {
            currentSetIndex: 0,
            currentLevel: 1, // Level 1, Level 2, Level 3
            studentName: '',

            l1SentenceIndex: 0,

            l1AvailableWords: [],

            l2AvailableSentences: [],

            mistakes: {

        const dom = {

            renderMenu() {
                dom.workspace.innerHTML = `

                        <p class="text-sm font-medium text-purple-600 mb-6 max-w-lg mx-auto">
                            Each set features a complete narrative story about 1 character. Build sentences with 1-2 word phrase cards, order the story paragraph, and fix mechanics step-by-step!
                        </p>

                        <div class="space-y-4 text-left">
                            ${SETS_DATA.map((setData, idx) => `
                                <div onclick="app.startSet(${idx})"
                                     class="group cursor-pointer bg-gradient-to-r ${setData.themeColor} p-5 rounded-3xl border-2 border-white/80 shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 flex items-center justify-between gap-4">
                                    <div class="flex items-center gap-4">
                                        <div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-purple-600 text-2xl shadow-sm group-hover:scale-110 transition-transform">

                            `).join('')}

            },

            setupLevel1() {
                state.currentLevel = 1;
                const set = SETS_DATA[state.currentSetIndex];
                const currentSentenceObj = set.sentences[state.l1SentenceIndex];

                state.l1SelectedWords = [];
                
                // Max 2-word phrase cards for fast learners, punctuation on single cards
                const phraseList = currentSentenceObj.phrases || currentSentenceObj.words;
                
                // Scramble phrase tiles list for Level 1
                let shuffled = [...phraseList];
                while (shuffled.join(' ') === phraseList.join(' ') && shuffled.length > 2) {
                    shuffled.sort(() => Math.random() - 0.5);
                }
                state.l1AvailableWords = shuffled.map((phraseText, id) => ({ id: `w_${id}_${Date.now()}`, text: phraseText }));

                this.renderLevel1();
            },

            renderLevel1() {
                const set = SETS_DATA[state.currentSetIndex];
                const totalSentences = set.sentences.length;

                dom.workspace.innerHTML = `
                    <div class="max-w-2xl mx-auto w-full">
                        <!-- Level Header -->
                        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                            <span class="px-4 py-1.5 rounded-full bg-pink-100 text-pink-700 border-2 border-pink-200 text-xs font-bold flex items-center gap-1.5">

                            </span>
                            <span class="text-xs font-bold text-purple-500 bg-purple-50 px-3 py-1 rounded-full border border-purple-200">
                                Story Part ${state.l1SentenceIndex + 1} of ${totalSentences} (${set.character}'s Story)
                            </span>
                        </div>

                        <!-- Target Sentence Construction Box -->
                        <div class="bg-pastel-sky/60 p-5 rounded-3xl border-2 border-sky-200 mb-6 min-h-[120px] flex flex-col justify-between shadow-sm">
                            <div class="text-xs font-bold text-sky-800 uppercase tracking-wider mb-2 flex items-center justify-between">
                                <span>✏️ Constructed Sentence:</span>
                                <span class="text-[11px] text-sky-600 font-normal">Tap phrase card to speak audio 🔊</span>
                            </div>

                            <div class="flex flex-wrap items-center gap-2 min-h-[50px] p-2 bg-white rounded-2xl border-2 border-sky-100">
                                ${state.l1SelectedWords.length === 0 ? '<span class="text-xs text-purple-300 font-medium italic p-2">Tap phrase cards below in correct order...</span>' : ''}
                                ${state.l1SelectedWords.map((item, idx) => `
                                    <button onclick="app.removeL1Word(${idx})" 
                                            class="tile-btn px-3.5 py-2 ${item.text === ',' || item.text === '.' ? 'bg-amber-500' : 'bg-purple-600'} text-white font-bold rounded-2xl text-sm md:text-base flex items-center gap-2 shadow-sm">
                                        <span>${item.text}</span>
                                        <i class="fa-solid fa-circle-xmark text-xs opacity-75"></i>
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Scrambled Phrase Pool -->
                        <div class="bg-white p-5 rounded-3xl border-2 border-purple-100 mb-6 shadow-sm">
                            <p class="text-xs font-bold text-purple-400 uppercase tracking-wider mb-3 text-center">
                                Phrase Cards (Max 2 words per card for fast learners):
                            </p>
                            <div class="flex flex-wrap items-center justify-center gap-2.5">
                                ${state.l1AvailableWords.map((item, idx) => `
                                    <div class="inline-flex items-center ${item.text === ',' || item.text === '.' ? 'bg-amber-100/70 border-amber-300' : 'bg-pastel-pink/40 border-pink-200'} border-2 rounded-2xl p-1 shadow-sm">
                                        <!-- Speech Button -->
                                        ${item.text !== ',' && item.text !== '.' ? `
                                            <button onclick="audioManager.speak('${item.text.replace(/'/g, "\\'")}')" 
                                                    class="w-8 h-8 rounded-xl bg-white text-pink-500 hover:bg-pink-50 flex items-center justify-center text-xs font-bold transition-all"
                                                    title="Listen to phrase">
                                                <i class="fa-solid fa-volume-high"></i>
                                            </button>
                                        ` : ''}
                                        <!-- Phrase Select Button -->
                                        <button onclick="app.selectL1Word(${idx})" 
                                                class="tile-btn px-3.5 py-1.5 font-extrabold ${item.text === ',' || item.text === '.' ? 'text-amber-900 text-lg md:text-xl px-4' : 'text-purple-900 text-sm md:text-base'}">
                                            ${item.text}
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-3">
                            <button onclick="app.clearL1Words()" class="w-1/3 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors">
                                Reset Phrases
                            </button>
                            <button onclick="app.checkL1Sentence()" class="w-2/3 py-3.5 rounded-2xl bg-pink-500 hover:bg-pink-600 text-white font-bold text-sm shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-check"></i>
                                <span>Check Story Sentence</span>
                            </button>
                        </div>
                    </div>
                `;
            },

            selectL1Word(idx) {
                audioManager.playPopTone();
                const wordObj = state.l1AvailableWords.splice(idx, 1)[0];
                state.l1SelectedWords.push(wordObj);
                
                if (wordObj.text !== ',' && wordObj.text !== '.') {
                    audioManager.speak(wordObj.text);
                }
                
                this.renderLevel1();
            },

            removeL1Word(idx) {
                audioManager.playPopTone();
                const wordObj = state.l1SelectedWords.splice(idx, 1)[0];
                state.l1AvailableWords.push(wordObj);
                this.renderLevel1();
            },

            clearL1Words() {
                state.l1AvailableWords = [...state.l1AvailableWords, ...state.l1SelectedWords];
                state.l1SelectedWords = [];
                this.renderLevel1();
            },

            checkL1Sentence() {
                const set = SETS_DATA[state.currentSetIndex];
                const targetObj = set.sentences[state.l1SentenceIndex];
                const targetPhrases = targetObj.phrases || targetObj.words;
                const targetText = targetPhrases.join(' ');
                const userText = state.l1SelectedWords.map(w => w.text).join(' ');

                if (userText === targetText) {
                    audioManager.playSuccessSound();
                    
                    if (state.l1SentenceIndex + 1 < set.sentences.length) {
                        state.l1SentenceIndex++;
                        setTimeout(() => this.setupLevel1(), 400);
                    } else {
                        setTimeout(() => this.setupLevel2(), 500);
                    }
                } else {
                    state.mistakes.level1++;
                    audioManager.playErrorSound();
                    alert("Not quite right yet! Make sure your phrase cards and punctuation marks ( , and . ) are in correct order.");
                }
            },

            setupLevel2() {
                state.currentLevel = 2;
                const set = SETS_DATA[state.currentSetIndex];

                state.l2SelectedSentences = [];
                
                // Scramble the story sentences for Level 2 narrative ordering
                let originalSentences = set.sentences.map(s => s.raw);
                let shuffled = [...originalSentences];
                while (shuffled.join('|||') === originalSentences.join('|||') && shuffled.length > 1) {
                    shuffled.sort(() => Math.random() - 0.5);
                }

                state.l2AvailableSentences = shuffled.map((text, id) => ({ id: `s_${id}_${Date.now()}`, text: text }));

                this.renderLevel2();
            },

            renderLevel2() {
                const set = SETS_DATA[state.currentSetIndex];

                dom.workspace.innerHTML = `
                    <div class="max-w-2xl mx-auto w-full">
                        <!-- Level Header -->
                        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                            <span class="px-4 py-1.5 rounded-full bg-sky-100 text-sky-700 border-2 border-sky-200 text-xs font-bold flex items-center gap-1.5">
                                <i class="fa-solid fa-align-left"></i> Level 2: Arrange Story Sentences in Narrative Order
                            </span>
                            <span class="text-xs font-bold text-purple-500 bg-purple-50 px-3 py-1 rounded-full border border-purple-200">
                                Story: ${set.title}
                            </span>
                        </div>

                        <!-- Target Paragraph Area -->
                        <div class="bg-pastel-lavender/50 p-5 rounded-3xl border-2 border-purple-200 mb-6 min-h-[140px] flex flex-col justify-between shadow-sm">
                            <div class="text-xs font-bold text-purple-900 uppercase tracking-wider mb-2">
                                📖 Arranged Narrative Paragraph Order:
                            </div>

                            <div class="space-y-2 p-3 bg-white rounded-2xl border-2 border-purple-100">
                                ${state.l2SelectedSentences.length === 0 ? '<span class="text-xs text-purple-300 font-medium italic">Tap story sentence cards below in chronological order...</span>' : ''}
                                ${state.l2SelectedSentences.map((item, idx) => `
                                    <div class="flex items-center justify-between bg-purple-50 p-3 rounded-2xl border border-purple-200 text-sm font-bold text-purple-900 shadow-sm">
                                        <div class="flex items-center gap-3">
                                            <span class="w-6 h-6 rounded-full bg-purple-600 text-white text-xs flex items-center justify-center font-bold">
                                                ${idx + 1}
                                            </span>
                                            <span>${item.text}</span>
                                        </div>
                                        <button onclick="app.removeL2Sentence(${idx})" class="text-rose-500 hover:text-rose-700 px-2 py-1">
                                            <i class="fa-solid fa-circle-xmark text-base"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Scrambled Sentences Pool -->
                        <div class="bg-white p-5 rounded-3xl border-2 border-purple-100 mb-6 shadow-sm">
                            <p class="text-xs font-bold text-purple-400 uppercase tracking-wider mb-3 text-center">
                                Story Sentence Cards (Listen button speaks each sentence):
                            </p>
                            <div class="space-y-2.5">
                                ${state.l2AvailableSentences.map((item, idx) => `
                                    <div class="flex items-center justify-between bg-pastel-sky/40 border-2 border-sky-200 rounded-2xl p-2.5 shadow-sm hover:border-sky-400 transition-colors">
                                        <button onclick="audioManager.speak('${item.text.replace(/'/g, "\\'")}')" 
                                                class="px-3 py-2 bg-white text-sky-600 hover:bg-sky-50 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm border border-sky-200"
                                                title="Listen to sentence">
                                            <i class="fa-solid fa-volume-high text-sm"></i>
                                            <span class="hidden sm:inline">Listen</span>
                                        </button>

                                        <button onclick="app.selectL2Sentence(${idx})" 
                                                class="flex-1 text-left px-3 text-sm md:text-base font-extrabold text-purple-900 leading-snug">
                                            ${item.text}
                                        </button>

                                        <button onclick="app.selectL2Sentence(${idx})" 
                                                class="px-3 py-1.5 bg-sky-500 text-white rounded-xl text-xs font-bold shadow-sm hover:bg-sky-600">
                                            Add <i class="fa-solid fa-plus text-[10px] ml-0.5"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-3">
                            <button onclick="app.clearL2Sentences()" class="w-1/3 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors">
                                Reset Order
                            </button>
                            <button onclick="app.checkL2Paragraph()" class="w-2/3 py-3.5 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-check"></i>
                                <span>Verify Narrative Sequence</span>
                            </button>
                        </div>
                    </div>
                `;
            },

            selectL2Sentence(idx) {
                audioManager.playPopTone();
                const item = state.l2AvailableSentences.splice(idx, 1)[0];
                state.l2SelectedSentences.push(item);
                this.renderLevel2();
            },

            removeL2Sentence(idx) {
                audioManager.playPopTone();
                const item = state.l2SelectedSentences.splice(idx, 1)[0];
                state.l2AvailableSentences.push(item);
                this.renderLevel2();
            },

            clearL2Sentences() {
                state.l2AvailableSentences = [...state.l2AvailableSentences, ...state.l2SelectedSentences];
                state.l2SelectedSentences = [];
                this.renderLevel2();
            },

            checkL2Paragraph() {
                const set = SETS_DATA[state.currentSetIndex];
                const originalOrder = set.sentences.map(s => s.raw).join(' ');
                const userOrder = state.l2SelectedSentences.map(s => s.text).join(' ');

                if (userOrder === originalOrder) {
                    audioManager.playSuccessSound();
                    setTimeout(() => this.setupLevel3(), 500);
                } else {
                    state.mistakes.level2++;
                    audioManager.playErrorSound();
                    alert("Story sequence is not in chronological narrative order yet! Check which event happens first in the story.");
                }
            },

            setupLevel3() {
                state.currentLevel = 3;
                const set = SETS_DATA[state.currentSetIndex];

                // Parse single word tokens and expected punctuation for Level 3 mechanics
                let tokenList = [];
                set.sentences.forEach(s => {
                    s.words.forEach((w, i) => {
                        if (w === ',' || w === '.') return; // Skip punctuation tokens themselves

                        // Check if next token in s.words is ',' or '.'
                        let expectedPunct = 'none';
                        if (s.words[i + 1] === ',') expectedPunct = ',';
                        if (s.words[i + 1] === '.') expectedPunct = '.';

                        tokenList.push({
                            originalWord: w,
                            lowercaseWord: w.toLowerCase(),
                            capitalizedWord: w.charAt(0).toUpperCase() + w.slice(1),
                            isCapitalized: false, // pupil starts all lowercase
                            correctIsCapital: (w.charAt(0) === w.charAt(0).toUpperCase() && /[a-zA-Z]/.test(w.charAt(0))),
                            correctPunct: expectedPunct,
                            userPunct: 'none'
                        });
                    });
                });

                state.l3UserWords = tokenList;
                this.renderLevel3();
            },

            renderLevel3() {
                const set = SETS_DATA[state.currentSetIndex];

                dom.workspace.innerHTML = `
                    <div class="max-w-2xl mx-auto w-full">
                        <!-- Level Header -->
                        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                            <span class="px-4 py-1.5 rounded-full bg-emerald-100 text-emerald-800 border-2 border-emerald-200 text-xs font-bold flex items-center gap-1.5">
                                <i class="fa-solid fa-spell-check"></i> Level 3: Fix Capital Letters & Punctuation in Paragraph
                            </span>
                            <span class="text-xs font-bold text-purple-500 bg-purple-50 px-3 py-1 rounded-full border border-purple-200">
                                Editing ${set.character}'s Story
                            </span>
                        </div>

                        <!-- Instructions Banner -->
                        <div class="bg-amber-50 border-2 border-amber-200 p-4 rounded-3xl mb-5 text-xs text-amber-900 font-semibold space-y-1">
                            <p class="font-extrabold text-amber-950 text-sm">💡 How to repair ${set.character}'s story narrative:</p>
                            <p>1. <strong>Tap words</strong> to change them into <strong>Capital Letters</strong> (for character names like <em>${set.character}</em>, days like <em>Saturday, Sunday</em>, proper nouns, and sentence beginnings).</p>
                            <p>2. Select punctuation ( <strong>,</strong> comma or <strong>.</strong> full stop ) in the <strong>[ ? ]</strong> dropdown boxes at necessary sentence breaks.</p>
                        </div>

                        <!-- Paragraph Editing Workspace -->
                        <div class="bg-white p-6 md:p-8 rounded-3xl border-3 border-purple-200 shadow-md mb-6 leading-relaxed">
                            <div class="flex flex-wrap items-baseline gap-y-3 gap-x-1.5 text-base md:text-lg">
                                ${state.l3UserWords.map((item, idx) => `
                                    <span class="inline-flex items-center">
                                        <!-- Word Capitalization Toggle Button -->
                                        <button onclick="app.toggleL3Capital(${idx})" 
                                                class="editable-word handwriting font-bold ${item.isCapitalized ? 'text-purple-700 bg-purple-100 border-purple-400' : 'text-slate-700 bg-slate-50 border-slate-300'}"
                                                title="Click to toggle Capital letter">
                                            ${item.isCapitalized ? item.capitalizedWord : item.lowercaseWord}
                                        </button>

                                        <!-- Punctuation Selector Dropdown (Only where punctuation actually belongs) -->
                                        ${item.correctPunct !== 'none' ? `
                                            <select onchange="app.changeL3Punct(${idx}, this.value)" class="punctuation-select text-sm font-extrabold ml-0.5">
                                                <option value="none" ${item.userPunct === 'none' ? 'selected' : ''}>[ ? ]</option>
                                                <option value="," ${item.userPunct === ',' ? 'selected' : ''}>,</option>
                                                <option value="." ${item.userPunct === '.' ? 'selected' : ''}>.</option>
                                            </select>
                                        ` : ''}
                                    </span>
                                `).join('')}
                            </div>
                        </div>

                        <button onclick="app.checkL3Repair()" class="w-full py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-base shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-clipboard-check text-xl"></i>
                            <span>Submit Repaired Narrative Story</span>
                        </button>
                    </div>
                `;
            },

            toggleL3Capital(idx) {
                audioManager.playPopTone();
                state.l3UserWords[idx].isCapitalized = !state.l3UserWords[idx].isCapitalized;
                this.renderLevel3();
            },

            changeL3Punct(idx, val) {
                state.l3UserWords[idx].userPunct = val;
            },

            checkL3Repair() {
                let errors = 0;
                let capErrors = 0;
                let punctErrors = 0;

                state.l3UserWords.forEach(w => {
                    if (w.isCapitalized !== w.correctIsCapital) {
                        errors++;
                        capErrors++;
                    }
                    if (w.correctPunct !== 'none' && w.userPunct !== w.correctPunct) {
                        errors++;
                        punctErrors++;
                    }
                });

                if (errors === 0) {
                    audioManager.playSuccessSound();
                    state.completedSets.push(state.currentSetIndex);
                    this.renderReportCard();
                } else {
                    state.mistakes.level3 += errors;
                    audioManager.playErrorSound();
                    
                    let msg = `You have ${errors} error(s) remaining in the narrative.\n`;
                    if (capErrors > 0) msg += `- Check capital letters for proper character names, days/places, and sentence beginnings.\n`;
                    if (punctErrors > 0) msg += `- Select the right punctuation mark ( , or . ) in the [ ? ] boxes.`;
                    
                    alert(msg);
                }
            },

            renderReportCard() {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }

                const set = SETS_DATA[state.currentSetIndex];
                const totalMistakes = state.mistakes.level1 + state.mistakes.level2 + state.mistakes.level3;

                dom.workspace.innerHTML = `
                    <div class="max-w-2xl mx-auto w-full text-center" id="reportCardPrintArea">
                        <div class="inline-block p-3 bg-amber-100 text-amber-600 rounded-3xl text-5xl mb-2 animate-bounce">
                            🏆
                        </div>
                        <h2 class="text-3xl font-extrabold text-purple-900 handwriting mb-1">Hebat! Awesome Job!</h2>
                        <p class="text-sm font-semibold text-purple-600 mb-6">You completed the narrative story for ${set.character} (${set.title}) across all 3 Levels!</p>

                        <!-- Learning Report Card -->
                        <div class="bg-white p-6 rounded-3xl border-3 border-purple-200 shadow-md text-left mb-6">
                            <div class="flex items-center justify-between border-b-2 border-purple-100 pb-3 mb-4">
                                <h3 class="text-xl font-extrabold text-purple-900 handwriting flex items-center gap-2">
                                    <i class="fa-solid fa-file-signature text-pink-500"></i> Narrative Writing Report Card
                                </h3>
                                <span class="bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1 rounded-full">
                                    ${new Date().toLocaleDateString('en-GB')}
                                </span>
                            </div>

                            <!-- Student Name Input Field -->
                            <div class="mb-5 bg-pastel-sky/60 p-4 rounded-2xl border-2 border-sky-200">
                                <label for="studentNameInput" class="block text-xs font-bold text-sky-900 uppercase tracking-wider mb-1.5">
                                    ✍️ Write Your Name Here:
                                </label>
                                <input type="text" 
                                       id="studentNameInput" 
                                       placeholder="Type student name..." 
                                       value="${state.studentName}"
                                       oninput="state.studentName = this.value"
                                       class="w-full px-4 py-2.5 rounded-xl border-2 border-sky-300 font-bold text-lg text-purple-900 bg-white focus:outline-none focus:ring-2 focus:ring-sky-400">
                            </div>

                            <!-- Level Breakdown List -->
                            <ul class="text-base font-bold text-slate-700 space-y-3 mb-6">
                                <li class="flex justify-between items-center border-b border-slate-100 pb-2">
                                    <span class="flex items-center gap-2 text-pink-600">
                                        <i class="fa-solid fa-cube text-xs"></i> Level 1 (Short 2-Word Phrase Scramble):
                                    </span> 
                                    <strong class="px-3 py-0.5 rounded-full bg-pink-50 text-pink-600 border border-pink-200">
                                        ${state.mistakes.level1} mistake(s)
                                    </strong>
                                </li>
                                <li class="flex justify-between items-center border-b border-slate-100 pb-2">
                                    <span class="flex items-center gap-2 text-sky-600">
                                        <i class="fa-solid fa-align-left text-xs"></i> Level 2 (Story Narrative Order):
                                    </span> 
                                    <strong class="px-3 py-0.5 rounded-full bg-sky-50 text-sky-600 border border-sky-200">
                                        ${state.mistakes.level2} mistake(s)
                                    </strong>
                                </li>
                                <li class="flex justify-between items-center border-b border-slate-100 pb-2">
                                    <span class="flex items-center gap-2 text-emerald-600">
                                        <i class="fa-solid fa-spell-check text-xs"></i> Level 3 (Capital & Punctuation):
                                    </span> 
                                    <strong class="px-3 py-0.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200">
                                        ${state.mistakes.level3} mistake(s)
                                    </strong>
                                </li>
                            </ul>

                            <!-- Teacher/System Compliment Box -->
                            <div class="bg-gradient-to-r from-amber-50 to-yellow-50 border-2 border-amber-200 rounded-2xl p-4 flex items-start gap-3">
                                <span class="text-3xl">🌟</span>
                                <div>
                                    <h4 class="text-xs font-bold text-amber-900 uppercase tracking-wider">Teacher's Note & Compliment</h4>
                                    <p class="text-sm font-semibold text-amber-950 mt-1 leading-relaxed">
                                        ${
                                            totalMistakes === 0 
                                            ? `Sempurna! You built ${set.character}'s story narrative with zero mistakes! You are a star writer! ⭐` 
                                            : (totalMistakes <= 3 
                                                ? `Hebat! Excellent effort! Your narrative sentence sequence and grammar mechanics are getting stronger! ✨` 
                                                : `Bagus! Good try! Practicing ${set.character}'s story builds your English writing confidence! 💪`)
                                        }
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Navigation Action Buttons -->
                        <div class="flex flex-wrap items-center justify-center gap-3 no-print">
                            <button onclick="window.print()" class="px-5 py-3 rounded-2xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md active:scale-95 flex items-center gap-2">
                                <i class="fa-solid fa-print"></i>
                                <span>Print Progress Record</span>
                            </button>
                            <button onclick="app.startSet(${state.currentSetIndex})" class="px-5 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs shadow-md active:scale-95 flex items-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Try Story Again</span>
                            </button>
                            <button onclick="app.resetToMenu()" class="px-5 py-3 rounded-2xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs shadow-md active:scale-95 flex items-center gap-2">
                                <i class="fa-solid fa-house"></i>
                                <span>Choose Another Story</span>
                            </button>
                        </div>
                    </div>
                `;
            }
        };

        // Initialize application on page load
        window.onload = () => {
            app.init();
        };
    </script>
</body>
</html>
